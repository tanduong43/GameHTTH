# ==============================================================================
# Nginx Reverse Proxy Configuration for GameHTTH WebGL & WebSocket
# ==============================================================================
# Hướng dẫn sử dụng:
# 1. Copy nội dung file này vào cấu hình Nginx của bạn (ví dụ: /etc/nginx/sites-available/game_htth)
# 2. Thay đổi "game.yourdomain.com" bằng tên miền thực tế của bạn
# 3. Trỏ đường dẫn SSL cert/key đến chứng chỉ của bạn (hoặc dùng certbot --nginx)
# ==============================================================================

# 1. Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    server_name game.yourdomain.com;
    return 301 https://$host$request_uri;
}

# 2. Cấu hình HTTPS + Web Hosting + WebSocket Reverse Proxy
server {
    listen 443 ssl http2;
    server_name game.yourdomain.com;

    # Đường dẫn chứng chỉ SSL (Let's Encrypt / Cloudflare)
    ssl_certificate /etc/letsencrypt/live/game.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Thư mục chứa file build WebGL (index.html, Build/, TemplateData/)
    root /var/www/game_htth/webgl;
    index index.html;

    # Cấu hình Gzip / Brotli cho Unity WebGL (Tăng tốc tải game)
    location ~ .+\.(data|symbols\.json)\.unityweb$ {
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }
    location ~ .+\.wasm\.unityweb$ {
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }
    location ~ .+\.js\.unityweb$ {
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }

    # Trang chủ WebGL Client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình WebSocket Proxy (Chuyển tiếp wss://game.yourdomain.com/ws -> Java Server WebSocket :2240)
    location /ws {
        proxy_pass http://127.0.0.1:2240;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # Truyền IP thật của người chơi vào Java Server
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout kết nối WebSocket dài để tránh bị ngắt kết nối khi treo game
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
