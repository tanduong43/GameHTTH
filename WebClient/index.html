<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TheGioiHaiTac">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>TheGioiHaiTac - Mobile Web Client</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏴‍☠️</text></svg>">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        position: fixed;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* === Container chính - tự động xoay khi ở portrait === */
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000000;
      }

      /* Khi ở chế độ dọc (portrait) trên mobile: xoay container 90 độ
         và hoán đổi width/height để fill toàn màn hình ngang */
      @media (orientation: portrait) and (max-width: 1024px) {
        #unity-container {
          transform: rotate(90deg);
          transform-origin: center center;
          width: 100vh;
          width: 100dvh;
          height: 100vw;
          position: absolute;
          top: 50%;
          left: 50%;
          margin-top: calc(-50vw);
          margin-left: calc(-50vh);
        }
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        background: #000000;
      }
      #loading-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0d1b2a;
        color: #ffffff;
        z-index: 99;
      }
      .loading-box {
        text-align: center;
        padding: 24px;
        max-width: 420px;
        width: 90%;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.15);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border-left-color: #e67e22;
        animation: spin 0.85s linear infinite;
        margin: 0 auto 18px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #f39c12;
        letter-spacing: 0.5px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: #1b263b;
        border-radius: 6px;
        margin: 14px auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #e67e22, #f1c40f);
        border-radius: 6px;
        transition: width 0.2s ease;
      }
      .loading-status {
        font-size: 13px;
        color: #a0aec0;
      }

      /* === Nút Toàn Màn Hình === */
      #fullscreen-btn {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 1000;
        background: rgba(13, 27, 42, 0.85);
        border: 1.5px solid rgba(230, 126, 34, 0.8);
        color: #f39c12;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        transition: transform 0.15s, background 0.2s;
        outline: none;
        backdrop-filter: blur(6px);
      }
      #fullscreen-btn:active {
        transform: scale(0.92);
        background: rgba(230, 126, 34, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- Unity Container -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-cover">
        <div class="loading-box">
          <div class="spinner"></div>
          <div class="loading-title">TheGioiHaiTac</div>
          <div class="progress-bar-bg">
            <div id="loading-bar" class="progress-bar-fill"></div>
          </div>
          <div id="loading-text" class="loading-status">Đang nạp tài nguyên game... 0%</div>
        </div>
      </div>
    </div>

    <!-- Nút Toàn Màn Hình -->
    <button id="fullscreen-btn" title="Toàn màn hình">⛶</button>

    <script src="Build/WebClient.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const loadingBar = document.querySelector("#loading-bar");
      const loadingText = document.querySelector("#loading-text");
      const fullscreenBtn = document.querySelector("#fullscreen-btn");

      // === Kiểm tra thiết bị Mobile ===
      const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                       (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

      // === Chặn Zoom / Pull-to-refresh trên iOS Safari ===
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("touchmove", (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // === Tự động kích hoạt Audio khi người dùng tương tác lần đầu ===
      function resumeAudioContext() {
        if (typeof WEBAudio !== "undefined" && WEBAudio.audioContext && WEBAudio.audioContext.state === "suspended") {
          WEBAudio.audioContext.resume();
        }
        window.removeEventListener("click", resumeAudioContext);
        window.removeEventListener("touchstart", resumeAudioContext);
      }
      window.addEventListener("click", resumeAudioContext);
      window.addEventListener("touchstart", resumeAudioContext);

      // === Fullscreen Logic (không dùng Fullscreen API để tránh thông báo trình duyệt) ===
      // Dùng Navigation Bar hide bằng cách scroll trick trên mobile
      let isFullscreenMode = false;

      function getFullscreenIcon() {
        return isFullscreenMode ? "⊡" : "⛶";
      }

      function toggleFullscreen() {
        if (!isFullscreenMode) {
          // Trên mobile: ẩn thanh địa chỉ bằng scroll trick
          // Trên desktop: vẫn dùng Fullscreen API vì không gây vấn đề
          if (!isMobile) {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
          } else {
            // Trên mobile: scroll để ẩn thanh address bar
            window.scrollTo(0, 1);
          }
          isFullscreenMode = true;
        } else {
          if (!isMobile) {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
          }
          isFullscreenMode = false;
        }
        fullscreenBtn.textContent = getFullscreenIcon();
      }

      fullscreenBtn.addEventListener("click", toggleFullscreen);

      // Cập nhật icon khi desktop fullscreen thay đổi
      document.addEventListener("fullscreenchange", () => {
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        isFullscreenMode = isFs;
        fullscreenBtn.textContent = getFullscreenIcon();
      });
      document.addEventListener("webkitfullscreenchange", () => {
        const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        isFullscreenMode = isFs;
        fullscreenBtn.textContent = getFullscreenIcon();
      });

      // === Xử lý bàn phím ảo trên mobile (tránh lỗi layout khi nhập tin nhắn) ===
      if (isMobile) {
        // Khi bàn phím ảo hiện lên, visualViewport sẽ thay đổi
        // Ta cần giữ nguyên kích thước canvas, không cho nó co lại
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", () => {
            // Giữ body luôn full kích thước màn hình thực, 
            // không bị ảnh hưởng bởi bàn phím ảo
            document.body.style.height = window.screen.height + "px";
          });

          window.visualViewport.addEventListener("scroll", () => {
            // Ngăn viewport scroll khi bàn phím hiện
            window.scrollTo(0, 0);
          });
        }

        // Ngăn resize event làm thay đổi layout khi bàn phím ảo mở/đóng
        let initialHeight = window.innerHeight;
        let initialWidth = window.innerWidth;
        
        window.addEventListener("resize", () => {
          // Nếu chỉ thay đổi chiều cao (bàn phím mở/đóng), giữ nguyên layout
          if (window.innerWidth === initialWidth && window.innerHeight < initialHeight) {
            document.body.style.height = initialHeight + "px";
            window.scrollTo(0, 0);
          } else {
            // Thay đổi orientation thật sự
            initialHeight = window.innerHeight;
            initialWidth = window.innerWidth;
          }
        });
      }

      // === Cấu hình Unity WebGL Instance ===
      const config = {
        dataUrl: "Build/WebClient.data",
        frameworkUrl: "Build/WebClient.framework.js",
        codeUrl: "Build/WebClient.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NguyenDuong",
        productName: "TheGioiHaiTac",
        productVersion: "1.3.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      function startUnityClient() {
        createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(100 * progress);
          loadingBar.style.width = percent + "%";
          loadingText.innerText = "Đang nạp tài nguyên game... " + percent + "%";
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
          fullscreenBtn.style.display = "flex";
        }).catch((message) => {
          console.error("Lỗi WebGL:", message);
          if (!sessionStorage.getItem("htth_auto_healed")) {
            sessionStorage.setItem("htth_auto_healed", "1");
            if (window.indexedDB && window.indexedDB.databases) {
              window.indexedDB.databases().then((dbs) => {
                return Promise.all(dbs.map((db) => window.indexedDB.deleteDatabase(db.name)));
              }).finally(() => {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          } else {
            alert("Lỗi tải WebGL: " + message);
          }
        });
      }

      // === Tự động dọn dẹp cache cũ khi có phiên bản mới mà người chơi không cần thao tác gì ===
      const CLIENT_BUILD_VER = "1.3.0";
      const localVer = localStorage.getItem("htth_web_ver");
      if (localVer !== CLIENT_BUILD_VER) {
        if (window.indexedDB && window.indexedDB.databases) {
          window.indexedDB.databases().then((dbs) => {
            dbs.forEach((db) => {
              if (db.name && (db.name.includes("idbfs") || db.name.includes("UnityCache"))) {
                window.indexedDB.deleteDatabase(db.name);
              }
            });
          }).finally(() => {
            localStorage.setItem("htth_web_ver", CLIENT_BUILD_VER);
            startUnityClient();
          });
        } else {
          localStorage.setItem("htth_web_ver", CLIENT_BUILD_VER);
          startUnityClient();
        }
      } else {
        startUnityClient();
      }
    </script>
  </body>
</html>
