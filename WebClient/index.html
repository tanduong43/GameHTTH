<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TheGioiHaiTac</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0d1b2a;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
      }
      #loading-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0d1b2a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        z-index: 99;
      }
      .loading-box {
        text-align: center;
        padding: 20px;
        max-width: 400px;
        width: 90%;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.15);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border-left-color: #e67e22;
        animation: spin 0.9s linear infinite;
        margin: 0 auto 16px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
        color: #f39c12;
      }
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: #1b263b;
        border-radius: 5px;
        margin: 12px auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #e67e22, #f1c40f);
        border-radius: 5px;
        transition: width 0.2s ease;
      }
      .loading-status {
        font-size: 13px;
        color: #a0aec0;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-cover">
        <div class="loading-box">
          <div class="spinner"></div>
          <div class="loading-title">TheGioiHaiTac</div>
          <div class="progress-bar-bg">
            <div id="loading-bar" class="progress-bar-fill"></div>
          </div>
          <div id="loading-text" class="loading-status">Đang nạp tài nguyên game... 0%</div>
        </div>
      </div>
    </div>

    <script src="Build/Web.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const loadingBar = document.querySelector("#loading-bar");
      const loadingText = document.querySelector("#loading-text");

      const config = {
        dataUrl: "Build/Web.data",
        frameworkUrl: "Build/Web.framework.js",
        codeUrl: "Build/Web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NguyenDuong",
        productName: "TheGioiHaiTac",
        productVersion: "1.2.9",
      };

      createUnityInstance(canvas, config, (progress) => {
        const percent = Math.round(100 * progress);
        loadingBar.style.width = percent + "%";
        loadingText.innerText = "Đang nạp tài nguyên game... " + percent + "%";
      }).then((unityInstance) => {
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert("Lỗi tải WebGL: " + message);
      });
    </script>
  </body>
</html>
