<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TheGioiHaiTac">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1b2a">
    <title>TheGioiHaiTac - Mobile Web Client</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        position: fixed;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000000;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        background: #000000;
      }
      #loading-cover {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0d1b2a;
        color: #ffffff;
        z-index: 99;
      }
      .loading-box {
        text-align: center;
        padding: 24px;
        max-width: 420px;
        width: 90%;
      }
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.15);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border-left-color: #e67e22;
        animation: spin 0.85s linear infinite;
        margin: 0 auto 18px auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #f39c12;
        letter-spacing: 0.5px;
      }
      .progress-bar-bg {
        width: 100%;
        height: 10px;
        background: #1b263b;
        border-radius: 6px;
        margin: 14px auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #e67e22, #f1c40f);
        border-radius: 6px;
        transition: width 0.2s ease;
      }
      .loading-status {
        font-size: 13px;
        color: #a0aec0;
      }

      /* === Màn hình nhắc xoay ngang điện thoại (Portrait Notice) === */
      #rotate-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: rgba(13, 27, 42, 0.96);
        z-index: 99999;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 24px;
        backdrop-filter: blur(10px);
      }
      .phone-icon-wrapper {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phone-rotate-anim {
        width: 44px;
        height: 74px;
        border: 3px solid #f39c12;
        border-radius: 8px;
        position: relative;
        animation: rotatePhone 2s ease-in-out infinite;
        box-shadow: 0 0 16px rgba(243, 156, 18, 0.4);
      }
      .phone-rotate-anim::before {
        content: '';
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 3px;
        background: #f39c12;
        border-radius: 2px;
      }
      .phone-rotate-anim::after {
        content: '';
        position: absolute;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        border: 1.5px solid #f39c12;
        border-radius: 50%;
      }
      @keyframes rotatePhone {
        0%, 15% {
          transform: rotate(0deg);
        }
        50%, 85% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      .rotate-title {
        font-size: 20px;
        font-weight: bold;
        color: #f1c40f;
        margin-bottom: 10px;
      }
      .rotate-subtitle {
        font-size: 14px;
        color: #cbd5e1;
        max-width: 320px;
        line-height: 1.5;
      }

      /* === Nút Toàn Màn Hình === */
      #fullscreen-btn {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 1000;
        background: rgba(13, 27, 42, 0.85);
        border: 1.5px solid rgba(230, 126, 34, 0.8);
        color: #f39c12;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        transition: transform 0.15s, background 0.2s;
        outline: none;
        backdrop-filter: blur(6px);
      }
      #fullscreen-btn:active {
        transform: scale(0.92);
        background: rgba(230, 126, 34, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- Màn hình hướng dẫn xoay ngang trên điện thoại -->
    <div id="rotate-overlay">
      <div class="phone-icon-wrapper">
        <div class="phone-rotate-anim"></div>
      </div>
      <div class="rotate-title">Vui lòng xoay ngang điện thoại</div>
      <div class="rotate-subtitle">Xoay ngang màn hình để trải nghiệm góc nhìn rộng và đầy đủ phím cảm ứng như trên điện thoại iOS / Android.</div>
    </div>

    <!-- Unity Container -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-cover">
        <div class="loading-box">
          <div class="spinner"></div>
          <div class="loading-title">TheGioiHaiTac</div>
          <div class="progress-bar-bg">
            <div id="loading-bar" class="progress-bar-fill"></div>
          </div>
          <div id="loading-text" class="loading-status">Đang nạp tài nguyên game... 0%</div>
        </div>
      </div>
    </div>

    <!-- Nút Toàn Màn Hình -->
    <button id="fullscreen-btn" title="Toàn màn hình">⛶</button>

    <script src="Build/WebClient.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const loadingBar = document.querySelector("#loading-bar");
      const loadingText = document.querySelector("#loading-text");
      const fullscreenBtn = document.querySelector("#fullscreen-btn");
      const rotateOverlay = document.querySelector("#rotate-overlay");

      // === Kiểm tra thiết bị Mobile ===
      const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                       (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

      // === Kiểm tra và hiển thị nhắc nhở xoay ngang ===
      function checkOrientation() {
        if (!isMobile) {
          rotateOverlay.style.display = "none";
          return;
        }
        const isPortrait = window.innerHeight > window.innerWidth;
        if (isPortrait) {
          rotateOverlay.style.display = "flex";
        } else {
          rotateOverlay.style.display = "none";
        }
      }

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", () => {
        setTimeout(checkOrientation, 200);
      });
      checkOrientation();

      // === Chặn Zoom / Pull-to-refresh trên iOS Safari ===
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("touchmove", (e) => {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

      // === Fullscreen Logic ===
      function getFullscreenIcon() {
        const isFs = !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
        return isFs ? "⊡" : "⛶";
      }

      function toggleFullscreen() {
        const isFs = !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
        if (!isFs) {
          const el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
          else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        }
      }

      fullscreenBtn.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", () => {
        fullscreenBtn.textContent = getFullscreenIcon();
      });
      document.addEventListener("webkitfullscreenchange", () => {
        fullscreenBtn.textContent = getFullscreenIcon();
      });

      // === Cấu hình Unity WebGL Instance ===
      const config = {
        dataUrl: "Build/WebClient.data",
        frameworkUrl: "Build/WebClient.framework.js",
        codeUrl: "Build/WebClient.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NguyenDuong",
        productName: "TheGioiHaiTac",
        productVersion: "1.3.0"
      };

      createUnityInstance(canvas, config, (progress) => {
        const percent = Math.round(100 * progress);
        loadingBar.style.width = percent + "%";
        loadingText.innerText = "Đang nạp tài nguyên game... " + percent + "%";
      }).then((unityInstance) => {
        loadingCover.style.display = "none";
        fullscreenBtn.style.display = "flex";
      }).catch((message) => {
        alert("Lỗi tải WebGL: " + message);
      });
    </script>
  </body>
</html>
